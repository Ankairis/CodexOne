name: Release

run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag, for example v0.1.0
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p dist package
          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            archive="codexone_${version}_${os}_${arch}"
            package_dir="package/$archive"
            binary="codexone"
            if [[ "$os" == "windows" ]]; then
              binary="codexone.exe"
            fi

            mkdir -p "$package_dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$package_dir/$binary" ./cmd/server
            cp README.md LICENSE .env.example "$package_dir/"

            if [[ "$os" == "windows" ]]; then
              (cd package && zip -q -r "../dist/$archive.zip" "$archive")
            else
              tar -C package -czf "dist/$archive.tar.gz" "$archive"
            fi
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          options=(
            "$RELEASE_TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "CodexOne $RELEASE_TAG"
            --generate-notes
            --fail-on-no-commits
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            options+=(--prerelease)
          fi
          gh release create "${options[@]}"

      - name: Add release link to summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "Published [$RELEASE_TAG]($release_url)" >> "$GITHUB_STEP_SUMMARY"
